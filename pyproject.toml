[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-topics"
version = "0.2.0"
description = "Formula 1 tweet topic modeling pipeline with hashtag-clean clustering and Gemini topic naming."
requires-python = ">=3.11"
dependencies = [
    "bertopic>=0.16.0",
    "gensim>=4.3.0",
    "google-genai>=1.0.0",
    "hdbscan>=0.8.33",
    "kagglehub>=0.3.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.8.0",
    "nltk>=3.8.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "umap-learn>=0.5.5",
]

[project.scripts]
f1-topics = "f1_topics.cli:main"

[tool.setuptools.packages.find]
include = ["f1_topics*"]
